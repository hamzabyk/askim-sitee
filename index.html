<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana Bir Sürpriz 🌸</title>

<style>
body {
  margin: 0;
  background: black;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Çiçek container */
.flower {
  position: relative;
  width: 200px;
  height: 200px;
}

/* Yapraklar */
.petal {
  position: absolute;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, #ff4da6, #8000ff);
  border-radius: 50%;
  transform: scale(0);
  animation: bloom 2s forwards;
}

/* Yaprak pozisyonları */
.petal:nth-child(1) { top: 0; left: 50px; animation-delay: 0.2s; }
.petal:nth-child(2) { top: 50px; left: 100px; animation-delay: 0.4s; }
.petal:nth-child(3) { top: 100px; left: 50px; animation-delay: 0.6s; }
.petal:nth-child(4) { top: 50px; left: 0; animation-delay: 0.8s; }

/* Orta kısım */
.center {
  position: absolute;
  top: 50px;
  left: 50px;
  width: 100px;
  height: 100px;
  background: #ff66cc;
  border-radius: 50%;
  box-shadow: 0 0 20px #ff66cc;
  transform: scale(0);
  animation: bloom 1.5s forwards;
}

/* Açılma animasyonu */
@keyframes bloom {
  to {
    transform: scale(1);
  }
}

/* Yazı */
.text {
  position: absolute;
  top: 70%;
  width: 100%;
  text-align: center;
  color: #ff99ff;
  font-size: 28px;
  font-family: sans-serif;
  opacity: 0;
  animation: fadeIn 2s forwards;
  animation-delay: 2s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}
</style>

</head>
<body>

<div class="flower">
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="petal"></div>
  <div class="center"></div>
</div>

<div class="text">Seni Çok Seviyorum ❤️</div>

</body>
</html>
